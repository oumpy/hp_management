  <hr />
  <div class="sharing-buttons">  <!-- Social media sharing buttons -->
    {% set buttons = SOCIAL_SHARE_BUTTONS|default(['twitter', 'facebook']) %}
    {% if TWITTER_USERNAME and 'twitter' in buttons %}
    <!-- Twitter / X -->
    <a href="https://twitter.com/share" class="twitter-share-button"
       data-via="{{ TWITTER_USERNAME }}" >Tweet</a>&nbsp;
    {% endif %}

    {% if 'facebook' in buttons %}
    <!-- Facebook -->
    <div class="fb-like"
      {% if page %}
        data-href="{{ SITEURL }}/{{ page.url }}"
      {% else %}
        data-href="{{ SITEURL }}/{{ article.url }}"
      {% endif %}
        data-layout="button_count"
        data-action="like" data-show-faces="true"
        data-share="true">
    </div>
    &nbsp;
    {% endif %}
  </div> <!-- /Social media sharing buttons -->
