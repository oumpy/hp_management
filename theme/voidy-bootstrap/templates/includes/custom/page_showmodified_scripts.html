{% if page.show_modified %}
<script>
    (function() {
        var meta = document.getElementsByName('page:modified')[0];
        var header = document.querySelector('header');
        if (!meta || !header) { return; }
        var p = document.createElement('p');
        p.className = 'modified-date';
        p.textContent = '( ' + meta.content + ' 最終更新 )';
        header.after(p);
    })();
</script>
{% endif %}
