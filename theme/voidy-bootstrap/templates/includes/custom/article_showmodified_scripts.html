{% if article.show_modified %}
<script>
    (function() {
        var meta = document.getElementsByName('article:modified')[0];
        var anchor = document.getElementById('modified-date-here');
        if (!meta || !anchor) { return; }
        var p = document.createElement('p');
        p.className = 'modified-date';
        p.textContent = '( ' + meta.content + ' 最終更新 )';
        anchor.after(p);
    })();
</script>
{% endif %}
