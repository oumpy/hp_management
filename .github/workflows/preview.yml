# Build a preview of every branch except master and publish it under
# previews/refs/heads/<branch>/ on the site.
#
# Single job: the site is built and pushed on the same runner.  (The former
# build/push job pair exchanged the built site as a ~100 MB workflow
# artifact, which added a couple of minutes and failed sporadically on
# artifact download.  The split had been meant to keep the deploy key away
# from branch-controlled code, but since a push-triggered workflow always
# runs the pushed branch's own workflow file, it never actually did.)

name: Preview

on:
  push:
    branches-ignore:
      - 'master'

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout branch
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Initialize Repository
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        sh tools/init.sh

    - name: Make the Product
      run: |
        {
          echo
          echo "SITEURL = '/previews/$GITHUB_REF'"
          echo "if 'PREVIEW_SITENAME_APPEND' in globals():"
          echo "    SITENAME += PREVIEW_SITENAME_APPEND"
          echo "    SITETAG += PREVIEW_SITENAME_APPEND"
        } >> ./content/contentconf.py
        rm -rf output.new
        pelican -o output.new

    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.bot_identity }}
        name: identity
        known_hosts: ${{ secrets.known_hosts }}
        config: |
          Host github
            HostName github.com
            User git
            IdentityFile ~/.ssh/identity

    - name: Check update of the branch
      # Skip publishing when the branch has moved on while we were building:
      # the run for the newer commit will publish instead.
      id: check_update
      run: |
        new_hash=$(git ls-remote --heads origin "${GITHUB_REF#refs/heads/}" | cut -f1)
        if [ "$GITHUB_SHA" = "$new_hash" ]; then
          newest='true'
        else
          newest='false'
          echo "Branch has moved on ($new_hash); not publishing $GITHUB_SHA."
        fi
        echo "newest=$newest" >> $GITHUB_OUTPUT

    - name: Set Preview in the output directory
      if: steps.check_update.outputs.newest=='true'
      run: |
        cd ./output
        git -c maintenance.autoDetach=false -c gc.autoDetach=false pull
        cd ../
        mkdir -p ./output/previews/$GITHUB_REF
        rm -rf ./output/previews/$GITHUB_REF
        mv ./output.new ./output/previews/$GITHUB_REF

    - name: Prune stale previews
      # Orphans (deleted branches) always; the repository variable
      # PREVIEW_MAX, when set, caps the number of previews kept.  The
      # deletions go into the same commit as the preview below, so they
      # cost no extra GitHub Pages build.
      if: steps.check_update.outputs.newest=='true'
      env:
        PRUNE_MODE: orphans
        PRUNE_KEEP: ${{ vars.PREVIEW_MAX }}
      run: |
        sh tools/prune_previews.sh

    - name: Deploy on Site
      if: steps.check_update.outputs.newest=='true'
      run: |
        cd output/
        git config user.name $GITHUB_ACTOR
        git config --add url.github:.pushInsteadOf https://github.com/
        git config --add url.github:.pushInsteadOf git@github.com:
        git add .
        git commit -m "${GITHUB_REF#refs/heads/} branch updated." && git push || true
