# Configuration for actions/labeler (v5+ format)
article:
- changed-files:
  - any-glob-to-any-file:
    - content/articles/*/blog/**
page/news:
- changed-files:
  - any-glob-to-any-file:
    - content/articles/*/news/**
    - content/pages/**
theme:
- changed-files:
  - any-glob-to-any-file:
    - theme/**
system:
- changed-files:
  - any-glob-to-any-file:
    - .github/**
    - myplugins/**
    - tools/**
document:
- changed-files:
  - any-glob-to-any-file:
    - README.md
    - content/README.md
    - docs/**
